# פאנל הניהול של האתר
backend:
  name: github
  repo: chog171067-hue/zgstudio
  branch: main
  commit_messages:
    update: "עדכון {{collection}}: {{slug}}"
    uploadMedia: "העלאת תמונה {{path}}"

site_url: https://zgstudio.co.il
display_url: https://zgstudio.co.il

media_folder: uploads
public_folder: /uploads

# כל תמונה שמועלית מוקטנת אוטומטית לפני השמירה (מקסימום 2560 פיקסלים, WebP)
media_libraries:
  default:
    config:
      max_file_size: 30000000
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 2560
          height: 2560

collections:
  - name: site
    label: תוכן האתר
    files:
      - name: works
        label: עבודות
        file: data/works.json
        media_folder: /uploads/works
        public_folder: /uploads/works
        fields:
          - name: works
            label: עבודות
            label_singular: עבודה
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { name: image, label: תמונה, widget: image }
              - { name: title, label: "שם הפרויקט (לא חובה)", widget: string, required: false }

      - name: clients
        label: לקוחות מרוצים
        file: data/clients.json
        media_folder: /uploads/logos
        public_folder: /uploads/logos
        fields:
          - name: clients
            label: לקוחות
            label_singular: לקוח
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: logo, label: "לוגו (עדיף SVG או PNG שקוף)", widget: image }
              - { name: name, label: שם הלקוח, widget: string }
